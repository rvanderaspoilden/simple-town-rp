services:
  seq:
    image: datalust/seq:latest
    container_name: simpletown-seq
    environment:
      ACCEPT_EULA: "Y"
      # Generate a password hash with:
      #   docker run --rm -it datalust/seq config hash
      # then paste the resulting hash here (NOT the plaintext password).
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: "${SEQ_ADMIN_PASSWORD_HASH}"
    ports:
      # Expose the ingest port (Seq internal :80) on the VPS loopback only so
      # the Unity host process can POST events via http://localhost:5341. We
      # deliberately bind to 127.0.0.1 — no external access, ingest stays
      # private to the box. The Seq web UI continues to go through Caddy on
      # the public :80/:443.
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    networks:
      - simpletown
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: simpletown-caddy
    ports:
      - "80:80"
      - "443:443"
    # Pass the basicauth + domain env vars into the Caddy container so the
    # `{$VAR}` interpolation in Caddyfile resolves. Without this, Caddy reads
    # blank strings, the basicauth directive becomes invalid, and the container
    # crashes in a restart loop.
    environment:
      SEQ_HOST: "${SEQ_HOST}"
      SEQ_BASIC_AUTH_HASH: "${SEQ_BASIC_AUTH_HASH}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # React dashboard static files. The CI deploy script rsyncs the
      # Vite build into /opt/simple-town/dashboard/dist on the host; Caddy
      # serves them read-only via the /app/* handler in the Caddyfile.
      - /opt/simple-town/dashboard:/var/dashboard:ro
    # Linux Docker doesn't auto-resolve host.docker.internal; this mapping
    # tells the container that name = the host's gateway IP. Used by the
    # Caddyfile to reverse_proxy /admin/* + /swagger/* to the NestJS backend
    # running on the VPS host (not inside a container).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - simpletown
    depends_on:
      - seq
    restart: unless-stopped

networks:
  simpletown:
    driver: bridge

volumes:
  seq-data:
  caddy-data:
  caddy-config:
