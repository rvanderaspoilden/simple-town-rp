# ONE-SHOT workflow to bootstrap a Unity Personal license for the CI.
#
# Procedure (do this once, then delete this file):
#   1. Push this file to master
#   2. Actions tab → "Get Unity license" → Run workflow
#   3. Once finished, download the "Manual-Activation-File" artifact
#   4. Unzip → you have a Unity_v6000.x.alf
#   5. Go to https://license.unity3d.com/manual → upload the .alf →
#      pick "Personal" → confirm → download the resulting .ulf
#   6. Open the .ulf in a text editor → copy the FULL contents
#   7. Repo Settings → Secrets and variables → Actions →
#      New repository secret → name UNITY_LICENSE, paste the .ulf content
#   8. Also create UNITY_EMAIL and UNITY_PASSWORD secrets (your Unity account)
#   9. Delete this file (rm .github/workflows/get-license.yml + push)
#
# Reference: https://game.ci/docs/github/activation
name: Get Unity license

on:
  workflow_dispatch:

jobs:
  request:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.4.4f1

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manual-Activation-File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
